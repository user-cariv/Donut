<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send to Donut Boost</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="popup">

  <!-- Header -->
  <header class="hd">
    <img class="logo" src="logo.png" alt="" width="44" height="44">
    <div class="ttl">
      <h1>Donut Boost</h1>
      <p>Send downloads to your PC</p>
    </div>
  </header>

  <!-- Link field -->
  <form id="send-link" class="send-form">
    <div class="block">
      <label for="download-link" class="lbl">Direct download or magnet link</label>
      <div class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        <input id="download-link" type="text" required placeholder="Paste a link or magnet" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <!-- Actions -->
    <div class="actions">
      <button type="submit" class="btn primary" id="send-button">
        Send to Donut Boost
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <button type="button" class="btn secondary" id="send-signed-in" title="Use cookies from this HTTPS site for this download only">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        Send with browser sign-in
      </button>
    </div>  </form>

  <p class="note">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
    <span id="status" role="status">Review and start the download in the Windows app.</span>
  </p>

  <!-- Automatic downloads -->
  <details class="auto" id="capture-options">
    <summary>
      <span>Automatic browser downloads</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </summary>
    <form class="auto-body" id="capture-form">
      <div class="row">
        <div>
          <div class="row-t">Send browser downloads to Donut Boost</div>
          <div class="row-s">Eligible downloads you start in your browser are sent to the Windows app.</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="capture-enabled" aria-label="Automatic browser downloads">
          <span class="track"></span>
        </label>
      </div>
      <label for="capture-minimum">Minimum size in MB</label>
      <input id="capture-minimum" type="number" min="0" max="1000000" step="1" value="10" required>
      <label for="capture-exclusions">Excluded domains, one per line</label>
      <textarea id="capture-exclusions" rows="3" maxlength="2000" placeholder="example.com"></textarea>
      <button class="btn secondary" type="submit">Save capture settings</button>
      <p id="capture-feedback" role="status"></p>
    </form>
  </details>

  <footer class="foot">
    <button type="button" class="btn ghost" id="reload-extension">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
      Reload extension
    </button>
  </footer>

</main>
<script src="handoff.js"></script>
<script src="popup.js"></script>
</body>
</html>
