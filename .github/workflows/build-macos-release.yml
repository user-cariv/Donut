name: Build macOS release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or update, for example v1.0.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build macOS DMG
        working-directory: Mac OS/Donut
        run: |
          set -euxo pipefail
          chmod +x package-macos.sh
          xcodebuild -version
          command -v sips
          command -v iconutil
          bash -x ./package-macos.sh
          mv "build/Install Donut.dmg" "build/Install-Donut-macOS.dmg"

      - name: Build Donut Island app
        working-directory: Donut Island
        run: |
          set -euxo pipefail
          chmod +x build.sh
          ./build.sh
          hdiutil create -volname "Donut Island" -srcfolder "Donut Island.app" -ov -format UDZO "Donut-Island-macOS.dmg"
          mkdir -p pkg-root/Applications
          cp -R "Donut Island.app" pkg-root/Applications/
          pkgbuild --root pkg-root --identifier com.ariv.donutisland --version 1.0.14 --install-location / "Donut-Island-macOS.pkg"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Donut $tag" --generate-notes
          fi
          gh release upload "$tag" "Mac OS/Donut/build/Install-Donut-macOS.dmg" --clobber
          gh release upload "$tag" "Donut Island/Donut-Island-macOS.dmg" --clobber
          gh release upload "$tag" "Donut Island/Donut-Island-macOS.pkg" --clobber
