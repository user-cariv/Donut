name: Build macOS release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or update, for example v1.0.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate Apple release signing configuration
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_DEVELOPER_ID_P12 APPLE_DEVELOPER_ID_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_INSTALLER_SIGNING_IDENTITY \
            APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required to create a signed and notarized macOS release"
              exit 1
            fi
          done

      - name: Import Apple Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_DEVELOPER_ID_P12" | base64 --decode > /tmp/developer-id.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/developer-id.p12 -k build.keychain -P "$APPLE_DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm -f /tmp/developer-id.p12

      - name: Configure Apple signing
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_REQUIRED=YES" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_ALLOWED=YES" >> "$GITHUB_ENV"
            echo "APPLE_INSTALLER_SIGNING_IDENTITY=$APPLE_INSTALLER_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          fi

      - name: Build macOS DMG
        working-directory: Mac OS/Donut
        run: |
          set -euxo pipefail
          chmod +x package-macos.sh
          xcodebuild -version
          command -v sips
          command -v iconutil
          bash -x ./package-macos.sh
          mv "build/Install Donut.dmg" "build/Install-Donut-macOS.dmg"

      - name: Build Donut Island app
        working-directory: Donut Island
        run: |
          set -euxo pipefail
          chmod +x build.sh
          ./build.sh
          hdiutil create -volname "Donut Island" -srcfolder "Donut Island.app" -ov -format UDZO "Donut-Island-macOS.dmg"
          mkdir -p pkg-root/Applications
          cp -R "Donut Island.app" pkg-root/Applications/
          pkgbuild --root pkg-root --identifier com.ariv.donutisland --version 1.0.16 --install-location / "Donut-Island-macOS.pkg"

      - name: Sign macOS artifacts
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict "Mac OS/Donut/build/Donut.app"
          codesign --verify --deep --strict "Donut Island/Donut Island.app"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "Mac OS/Donut/build/Install-Donut-macOS.dmg"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "Donut Island/Donut-Island-macOS.dmg"
          productsign --timestamp --sign "$APPLE_INSTALLER_SIGNING_IDENTITY" "Donut Island/Donut-Island-macOS.pkg" "Donut Island/Donut-Island-macOS-signed.pkg"
          mv "Donut Island/Donut-Island-macOS-signed.pkg" "Donut Island/Donut-Island-macOS.pkg"

      - name: Notarize macOS artifacts
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "Mac OS/Donut/build/Install-Donut-macOS.dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "Mac OS/Donut/build/Install-Donut-macOS.dmg"
          xcrun notarytool submit "Donut Island/Donut-Island-macOS.dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "Donut Island/Donut-Island-macOS.dmg"
          if [ -f "Donut Island/Donut-Island-macOS.pkg" ]; then
            xcrun notarytool submit "Donut Island/Donut-Island-macOS.pkg" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "Donut Island/Donut-Island-macOS.pkg"
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "::error::Invalid release tag"
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Donut $tag" --generate-notes
          fi
          gh release upload "$tag" "Mac OS/Donut/build/Install-Donut-macOS.dmg" --clobber
          gh release upload "$tag" "Donut Island/Donut-Island-macOS.dmg" --clobber
          gh release upload "$tag" "Donut Island/Donut-Island-macOS.pkg" --clobber
