name: Build Donut Lock downloads

on:
  push:
    branches: [main]
    paths:
      - 'Donut Lock/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows app
        run: >-
          dotnet publish "Donut Lock/windows/DonutLock.csproj"
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/windows
      - name: Package Windows download
        run: Compress-Archive -Path "artifacts/windows/*" -DestinationPath "Donut-Lock-Windows-x64.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: Donut-Lock-Windows-x64
          path: Donut-Lock-Windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and package macOS app
        working-directory: Donut Lock/macOS
        run: |
          bash ./build-macos-app.sh
          ditto -c -k --sequesterRsrc --keepParent "build/Donut Lock.app" "Donut-Lock-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Donut-Lock-macOS
          path: Donut Lock/macOS/Donut-Lock-macOS.zip

  publish-downloads:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish rolling Donut Lock release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: donut-lock-latest
          name: Donut Lock downloads
          body: Windows and macOS builds of Donut Lock. Download the ZIP for your computer and see the Donut Lock website page for installation notes.
          files: release-files/*.zip
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: true
          make_latest: false
