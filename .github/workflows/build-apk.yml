name: Validate Android web bundle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      working-directory: android
      run: npm install --legacy-peer-deps

    - name: Type-check Android app
      working-directory: android
      run: npm run lint

    - name: Build web bundle
      working-directory: android
      run: npm run build:web

    - name: Upload web bundle
      uses: actions/upload-artifact@v4
      with:
        name: DonutConvert-web
        path: android/dist

    - name: Upload published APK
      uses: actions/upload-artifact@v4
      with:
        name: DonutConvert-APK
        path: |
          android/public/DonutConvert.apk
          android/public/Donut Convert.apk
