name: Build and sign Donut Convert APK

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - name: Install dependencies
      working-directory: android
      run: npm ci --legacy-peer-deps

    - name: Type-check Android app
      working-directory: android
      run: npm run lint

    - name: Build web bundle and release APK
      working-directory: android
      env:
        RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        sudo apt-get update
        sudo apt-get install -y android-sdk android-sdk-build-tools apksigner zipalign aapt
        if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
          echo "::error::RELEASE_KEYSTORE_BASE64 secret is not configured"
          exit 1
        fi
        printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE"
        npm run build

    - name: Verify APK signature
      working-directory: android
      run: apksigner verify --verbose "public/Donut Convert.apk"

    - name: Upload signed APK
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: DonutConvert-APK
        path: |
          android/public/DonutConvert.apk
          android/public/Donut Convert.apk

    - name: Create Android GitHub Release
      if: startsWith(github.ref, 'refs/tags/android-v')
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: gh release create "$RELEASE_TAG" "android/public/Donut Convert.apk" --title "Donut Convert $RELEASE_TAG" --generate-notes
