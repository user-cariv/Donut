name: Build Android APK & Play Store Bundle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Android APK
      run: ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug

    - name: Build Play Store Bundle (AAB)
      run: ./gradlew bundleRelease || true

    - name: Upload APK to Artifacts & Releases
      uses: actions/upload-artifact@v4
      with:
        name: DonutConvert-APK
        path: app/build/outputs/apk/**/*.apk

    - name: Upload Play Store AAB
      uses: actions/upload-artifact@v4
      with:
        name: DonutConvert-PlayStore-AAB
        path: app/build/outputs/bundle/**/*.aab
