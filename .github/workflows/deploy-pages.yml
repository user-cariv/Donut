name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Assign a unique Donut Boost build version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "Windows/Donut Boost/DonutBoost.csproj" -Raw
          $baseVersion = [string]$project.Project.PropertyGroup.Version
          if ($baseVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid Donut Boost base version: $baseVersion" }
          $buildVersion = "$baseVersion.$env:GITHUB_RUN_NUMBER"
          "DONUT_BOOST_BUILD_VERSION=$buildVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $manifestPath = "Website/boost-version.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.latestVersion = $buildVersion
          $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath -Encoding utf8

      - name: Publish Donut Boost for Windows
        shell: pwsh
        run: |
          dotnet publish "Windows/Donut Boost/DonutBoost.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false "-p:Version=$env:DONUT_BOOST_BUILD_VERSION" "-p:AssemblyVersion=$env:DONUT_BOOST_BUILD_VERSION" "-p:FileVersion=$env:DONUT_BOOST_BUILD_VERSION" "-p:InformationalVersion=$env:DONUT_BOOST_BUILD_VERSION" -o "Windows/Donut Boost/publish/win-x64"
          if ($LASTEXITCODE -ne 0) { throw "Donut Boost publish failed" }
          $appVersion = (Get-Item "Windows/Donut Boost/publish/win-x64/DonutBoost.exe").VersionInfo.FileVersion
          if ($appVersion -ne $env:DONUT_BOOST_BUILD_VERSION) { throw "App version $appVersion does not match $env:DONUT_BOOST_BUILD_VERSION" }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found" }

      - name: Build installer and prepare website
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path _site -Force | Out-Null
          Copy-Item -Path "Website\*" -Destination _site -Recurse -Force
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          Push-Location "Windows/Donut Boost"
          try {
            & $compiler /Qp "/DMyAppVersion=$env:DONUT_BOOST_BUILD_VERSION" installer.iss
            if ($LASTEXITCODE -ne 0) { throw "Donut Boost installer build failed" }
          } finally {
            Pop-Location
          }
          $installer = "Windows/Donut Boost/installer/Install Donut Boost.exe"
          if (-not (Test-Path $installer)) { throw "Donut Boost installer output is missing" }
          $installerVersion = (Get-Item $installer).VersionInfo.FileVersion
          if ($installerVersion -ne $env:DONUT_BOOST_BUILD_VERSION) { throw "Installer version $installerVersion does not match $env:DONUT_BOOST_BUILD_VERSION" }
          Copy-Item $installer "_site/Install Donut Boost.exe" -Force
          $manifestPath = "_site/boost-version.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest | Add-Member -NotePropertyName installerSha256 -NotePropertyValue (Get-FileHash "_site/Install Donut Boost.exe" -Algorithm SHA256).Hash -Force
          $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath -Encoding utf8

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          name: github-pages
          path: _site

  deploy:
    needs: build
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
