name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select the Donut Boost build
        id: boost
        shell: pwsh
        run: |
          [xml]$project = Get-Content "Windows/Donut Boost/DonutBoost.csproj" -Raw
          $baseVersion = [string]$project.Project.PropertyGroup.Version
          if ($baseVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid Donut Boost base version: $baseVersion" }
          $source = git rev-parse "HEAD:Windows/Donut Boost" "HEAD:.github/workflows/deploy-pages.yml"
          if ($LASTEXITCODE -ne 0 -or @($source).Count -ne 2) { throw "Could not identify Donut Boost build inputs" }
          $buildSource = $source -join '.'
          "DONUT_BOOST_BUILD_SOURCE=$buildSource" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $baseUrl = 'https://user-cariv.github.io/Donut'
          $cachedInstaller = Join-Path $env:RUNNER_TEMP 'DonutBoost-live-installer.exe'
          $buildVersion = "$baseVersion.$env:GITHUB_RUN_NUMBER"
          $reuse = $false
          try {
            $live = Invoke-RestMethod "$baseUrl/boost-version.json?run=$env:GITHUB_RUN_ID" -TimeoutSec 15
            $versionPattern = '^' + [regex]::Escape($baseVersion) + '\.\d+$'
            if ($live.buildSource -eq $buildSource -and $live.latestVersion -match $versionPattern -and
                $live.installerSha256 -match '^[a-fA-F0-9]{64}$') {
              $expectedUrl = "$baseUrl/updates/$($live.latestVersion)/Install%20Donut%20Boost.exe"
              if ($live.downloadUrl -eq $expectedUrl) {
                Invoke-WebRequest $expectedUrl -OutFile $cachedInstaller -TimeoutSec 90
                $hash = (Get-FileHash $cachedInstaller -Algorithm SHA256).Hash
                $version = (Get-Item $cachedInstaller).VersionInfo.FileVersion.Trim()
                if ($hash -eq $live.installerSha256 -and $version -eq $live.latestVersion) {
                  $buildVersion = $version
                  $reuse = $true
                }
              }
            }
          } catch {
            Write-Warning 'The published installer could not be reused. Building a fresh installer.'
          }
          "reuse=$($reuse.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "DONUT_BOOST_CACHED_INSTALLER=$cachedInstaller" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DONUT_BOOST_BUILD_VERSION=$buildVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install the current .NET 8 servicing SDK
        if: steps.boost.outputs.reuse != 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.6.2
        with:
          dotnet-version: "8.0.x"

      - name: Publish Donut Boost for Windows
        if: steps.boost.outputs.reuse != 'true'
        shell: pwsh
        run: |
          dotnet publish "Windows/Donut Boost/DonutBoost.csproj" -c Release -r win-x64 --self-contained true -p:TargetLatestRuntimePatch=true -p:PublishSingleFile=false -p:PublishTrimmed=false "-p:Version=$env:DONUT_BOOST_BUILD_VERSION" "-p:AssemblyVersion=$env:DONUT_BOOST_BUILD_VERSION" "-p:FileVersion=$env:DONUT_BOOST_BUILD_VERSION" "-p:InformationalVersion=$env:DONUT_BOOST_BUILD_VERSION" -o "Windows/Donut Boost/publish/win-x64"
          if ($LASTEXITCODE -ne 0) { throw "Donut Boost publish failed" }
          $appVersion = (Get-Item "Windows/Donut Boost/publish/win-x64/DonutBoost.exe").VersionInfo.FileVersion
          if ($appVersion -ne $env:DONUT_BOOST_BUILD_VERSION) { throw "App version $appVersion does not match $env:DONUT_BOOST_BUILD_VERSION" }

      - name: Install Go for the System Merge engine
        if: steps.boost.outputs.reuse != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: false

      - name: Build the bundled System Merge engine
        if: steps.boost.outputs.reuse != 'true'
        shell: pwsh
        run: |
          & "Windows/Donut Boost/SystemMerge/Build.ps1" -OutputDirectory "Windows/Donut Boost/publish/win-x64/system-merge"

      - name: Install Inno Setup compiler
        if: steps.boost.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found" }

      - name: Build Donut Boost installer
        if: steps.boost.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          Push-Location "Windows/Donut Boost"
          try {
            & $compiler /Qp "/DMyAppVersion=$env:DONUT_BOOST_BUILD_VERSION" installer.iss
            if ($LASTEXITCODE -ne 0) { throw "Donut Boost installer build failed" }
          } finally {
            Pop-Location
          }
      - name: Prepare website and update manifest
        shell: pwsh
        env:
          REUSE_BOOST_INSTALLER: ${{ steps.boost.outputs.reuse }}
        run: |
          New-Item -ItemType Directory -Path _site -Force | Out-Null
          Copy-Item -Path "Website\*" -Destination _site -Recurse -Force
          $extensionSource = (Resolve-Path "Windows/Donut Boost/browser-extension/chrome").Path
          $extension = Get-Content (Join-Path $extensionSource 'manifest.json') -Raw | ConvertFrom-Json
          if ($extension.manifest_version -ne 3 -or $extension.version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Invalid Donut Boost extension manifest'
          }
          $requiredExtensionFiles = @($extension.background.service_worker, $extension.action.default_popup, 'handoff.js', 'capture.js', 'popup.js', 'popup.css')
          $requiredExtensionFiles += $extension.icons.PSObject.Properties.Value
          $requiredExtensionFiles += $extension.action.default_icon.PSObject.Properties.Value
          foreach ($file in $requiredExtensionFiles) {
            if (!$file -or !(Test-Path -LiteralPath (Join-Path $extensionSource $file) -PathType Leaf)) {
              throw "Missing bundled extension file: $file"
            }
          }
          $extensionZip = Join-Path (Resolve-Path _site).Path 'Donut Boost Chrome Extension.zip'
          Push-Location $extensionSource
          try {
            $extensionEntries = @(Get-ChildItem -Name)
            tar.exe -cf $extensionZip --format zip -- @extensionEntries
            if ($LASTEXITCODE -ne 0) { throw 'Could not package the bundled extension' }
          } finally {
            Pop-Location
          }
          $boostPage = "_site/boost.html"
          $boostHtml = Get-Content $boostPage -Raw
          $boostHtml -replace 'Chrome%20Extension\.zip\?v=[\d.]+', "Chrome%20Extension.zip?v=$($extension.version)" |
            Set-Content $boostPage -Encoding utf8
          $installer = if ($env:REUSE_BOOST_INSTALLER -eq 'true') {
            $env:DONUT_BOOST_CACHED_INSTALLER
          } else {
            "Windows/Donut Boost/installer/Install Donut Boost.exe"
          }
          if (-not (Test-Path $installer)) { throw "Donut Boost installer output is missing" }
          $installerVersion = (Get-Item $installer).VersionInfo.FileVersion.Trim()
          if ($installerVersion -ne $env:DONUT_BOOST_BUILD_VERSION) { throw "Installer version $installerVersion does not match $env:DONUT_BOOST_BUILD_VERSION" }
          Copy-Item $installer "_site/Install Donut Boost.exe" -Force
          $updatePath = "updates/$env:DONUT_BOOST_BUILD_VERSION"
          New-Item -ItemType Directory -Path "_site/$updatePath" -Force | Out-Null
          Copy-Item $installer "_site/$updatePath/Install Donut Boost.exe" -Force
          (Get-Content $boostPage -Raw).Replace('href="Install%20Donut%20Boost.exe"', "href=`"$updatePath/Install%20Donut%20Boost.exe`"") |
            Set-Content $boostPage -Encoding utf8
          $manifestPath = "_site/boost-version.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.latestVersion = $env:DONUT_BOOST_BUILD_VERSION
          $manifest.downloadUrl = "https://user-cariv.github.io/Donut/$updatePath/Install%20Donut%20Boost.exe"
          $manifest.fallbackUrl = $manifest.downloadUrl
          $manifest | Add-Member -NotePropertyName buildSource -NotePropertyValue $env:DONUT_BOOST_BUILD_SOURCE -Force
          $manifest | Add-Member -NotePropertyName installerSha256 -NotePropertyValue (Get-FileHash "_site/$updatePath/Install Donut Boost.exe" -Algorithm SHA256).Hash -Force
          $manifest | Add-Member -NotePropertyName extensionVersion -NotePropertyValue $extension.version -Force
          $manifest | Add-Member -NotePropertyName extensionSha256 -NotePropertyValue (Get-FileHash $extensionZip -Algorithm SHA256).Hash -Force
          $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath -Encoding utf8

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          name: github-pages
          path: _site

  deploy:
    needs: build
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
