<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#0d0b14"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="42%" r="45%"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".35"><animate attributeName="stop-opacity" values=".25;.45;.25" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb26b"/><stop offset=".5" stop-color="#ff5e8a"/><stop offset="1" stop-color="#8a5cf6"/></linearGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#bfb8d6"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1200" height="640" fill="url(#bg)"/>
<rect width="1200" height="640" fill="url(#glow)"/>
<g transform="translate(600 235)">
  <g filter="url(#blur)" opacity=".7"><circle r="92" fill="none" stroke="url(#ring)" stroke-width="46"/></g>
  <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    <circle r="92" fill="none" stroke="url(#ring)" stroke-width="46"/>
    <circle r="92" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="46" stroke-dasharray="6 40" stroke-linecap="round"/>
  </g>
  <circle r="112" fill="none" stroke="#fff" stroke-opacity=".12" stroke-dasharray="2 10"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/></circle>
  <circle r="150" fill="none" stroke="#fff" stroke-opacity=".07"><animate attributeName="r" values="150;165;150" dur="5s" repeatCount="indefinite"/></circle>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
  <text x="600" y="470" font-size="76" font-weight="700" fill="url(#txt)" letter-spacing="-2">Small apps. Big relief.
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/></text>
  <text x="600" y="525" font-size="26" fill="#a1a1aa" letter-spacing=".2">Focused tools for a calmer digital life.
    <animate attributeName="opacity" from="0" to="1" begin=".6s" dur="1.4s" fill="freeze"/></text>
  <text x="600" y="585" font-size="15" fill="#ff8a3d" letter-spacing="6" font-weight="600">DONUT  ·  CONVERT  ·  ISLAND  ·  BOOST</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>